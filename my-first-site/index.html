<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A new website project awaiting its content brief." />
    <title>New Website Project</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #16233b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(42rem, 100%);
        padding: clamp(2rem, 8vw, 5rem);
        border: 1px solid #d8d0c0;
        border-radius: 1.5rem;
        background: #fffdf8;
        box-shadow: 0 1.5rem 4rem rgb(22 35 59 / 10%);
      }

      p {
        margin: 0 0 0.75rem;
        line-height: 1.6;
      }

      .eyebrow {
        color: #8c4a2f;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }

      .status {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #d8d0c0;
        color: #536078;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Project initialized</p>
      <h1>Your website starts here.</h1>
      <p>The project and hosting configuration are ready for the content brief.</p>
      <p class="status">Temporary setup page — replace during the first content build.</p>
    </main>
  </body>
</html>
